[project]
name = "pydantic-ai-todo"
version = "0.2.7"
description = "Todo/task planning toolset for pydantic-ai agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vstorm", email = "hr@vstorm.co" }]
keywords = ["pydantic", "pydantic-ai", "ai", "agents", "todo", "task-management", "toolset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai-slim>=1.74.0",
    "pydantic>=2.0",
    "redis>=7.4.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]

[project.urls]
Homepage = "https://github.com/vstorm-co/pydantic-ai-todo"
Documentation = "https://github.com/vstorm-co/pydantic-ai-todo#readme"
Repository = "https://github.com/vstorm-co/pydantic-ai-todo"
Issues = "https://github.com/vstorm-co/pydantic-ai-todo/issues"
Changelog = "https://github.com/vstorm-co/pydantic-ai-todo/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_todo"]

[dependency-groups]
dev = [
    "asyncpg>=0.29.0",
    "build>=1.0.0",
    "coverage>=7.0.0",
    "pyright>=1.1.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pydantic_ai_todo"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnusedFunction = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
